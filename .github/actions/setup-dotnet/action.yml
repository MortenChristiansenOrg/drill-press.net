name: Set up .NET dependencies
description: Install the SDK and reuse downloaded NuGet packages across validation jobs.

runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      id: sdk
      with:
        dotnet-version: '10.x'
    - uses: actions/cache@v5
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-${{ hashFiles('global.json', '**/*.csproj', '**/*.props', '**/*.targets', '**/packages.lock.json', '.config/dotnet-tools.json') }}
        restore-keys: |
          nuget-${{ runner.os }}-${{ runner.arch }}-${{ steps.sdk.outputs.dotnet-version }}-
