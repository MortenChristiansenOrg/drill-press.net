name: Release validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-4vcpu-windows-2025]
        tag: ${{ inputs.tag && fromJSON(format('["{0}"]', inputs.tag)) || fromJSON('["v1.0.0", "v1.0.0-rc.1"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_UI_LANGUAGE: en-US
      VSLANG: 1033
      RELEASE_TAG: ${{ matrix.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Validate version tag
        id: version
        run: |
          dotnet build tools/DrillPress.Release -c Release
          version=$(dotnet tools/DrillPress.Release/bin/Release/net10.0/DrillPress.Release.dll version "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Check formatting
        run: |
          dotnet tool restore
          dotnet csharpier check .
      - name: Build and pack the tagged version
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet build DrillPress.slnx -c Release -p:Version="$RELEASE_VERSION"
          dotnet pack DrillPress.slnx -c Release --no-build -p:Version="$RELEASE_VERSION" -o artifacts/packages
          dotnet tools/DrillPress.Release/bin/Release/net10.0/DrillPress.Release.dll validate "$RELEASE_TAG" artifacts/packages
      - name: Test including installation of the exact release artifacts
        env:
          DRILLPRESS_RELEASE_FEED: ${{ github.workspace }}/artifacts/packages
        run: dotnet test --solution DrillPress.slnx -c Release --no-build
      - name: Retain validated packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.tag }}-${{ runner.os }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 90
