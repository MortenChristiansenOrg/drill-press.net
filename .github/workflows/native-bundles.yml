name: Native rule bundles

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-2vcpu-ubuntu-2404
            rid: linux-x64
          - os: blacksmith-2vcpu-windows-2025
            rid: win-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      DOTNET_CLI_UI_LANGUAGE: en-US
      VSLANG: 1033
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dotnet
      - name: Install Linux native prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: Build, publish, and execute parity cases
        run: dotnet run --file scripts/VerifyNativeBundles.cs -c Release -- --output artifacts/ci-${{ matrix.rid }}
      - name: Retain verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-bundle-report-${{ matrix.rid }}
          path: |
            artifacts/ci-${{ matrix.rid }}/*.log
            artifacts/ci-${{ matrix.rid }}/*.stdout
            artifacts/ci-${{ matrix.rid }}/*.stderr
            artifacts/ci-${{ matrix.rid }}/*.json
          if-no-files-found: warn
